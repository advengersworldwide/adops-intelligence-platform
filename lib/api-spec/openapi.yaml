openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AdOps Intelligence Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Client management
  - name: platforms
    description: DSP platform management
  - name: campaigns
    description: Campaign management
  - name: transactions
    description: Transaction/spend data
  - name: analytics
    description: Analytics and dashboard summaries
  - name: import
    description: Bulk data import
  - name: buying-houses
    description: Buying house management and analytics
  - name: billing
    description: Standalone billing record management
  - name: bills
    description: Invoice/bill management
  - name: payments
    description: Payment recording and settlement
  - name: cost-resources
    description: Business cost resource tracking
  - name: file-upload
    description: File attachment uploads
  - name: cost-models
    description: Global cost model catalog
  - name: payment-terms
    description: Global payment terms catalog
  - name: tax-settings
    description: Global tax configuration
  - name: billings
    description: PO/event-based billing, summary and detail
  - name: partner-bills
    description: Bills received from partners
  - { name: partner-payments, description: Disbursements to partners }
  - { name: dependencies, description: Dependency-aware delete impact resolution }

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Clients ──────────────────────────────────────────────────────────────────
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Validation error

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /clients/{id}/events:
    get:
      operationId: listClientEvents
      tags: [clients]
      summary: List events for a client
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClientEvent" }
    post:
      operationId: createClientEvent
      tags: [clients]
      summary: Add an event to a client
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientEventInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientEvent" }
        "400": { description: Validation error }

  /clients/{id}/events/{eventId}:
    patch:
      operationId: updateClientEvent
      tags: [clients]
      summary: Update a client event
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: eventId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientEventUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientEvent" }
        "404": { description: Not found }
    delete:
      operationId: deleteClientEvent
      tags: [clients]
      summary: Delete a client event
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: eventId, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }

  # ── Cost Models ──────────────────────────────────────────────────────────────
  /cost-models:
    get:
      operationId: listCostModels
      tags: [cost-models]
      summary: List all cost models
      responses:
        "200":
          description: List of cost models
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CostModel" }
    post:
      operationId: createCostModel
      tags: [cost-models]
      summary: Create a cost model
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CostModelInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostModel" }
        "400": { description: Validation error }

  /cost-models/{id}:
    delete:
      operationId: deleteCostModel
      tags: [cost-models]
      summary: Delete a cost model
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }

  # ── Payment Terms ─────────────────────────────────────────────────────────────
  /payment-terms:
    get:
      operationId: listPaymentTerms
      tags: [payment-terms]
      summary: List all payment terms
      responses:
        "200":
          description: List of payment terms
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentTerm" }
    post:
      operationId: createPaymentTerm
      tags: [payment-terms]
      summary: Create a payment term
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentTermInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentTerm" }
        "400": { description: Validation error }

  /payment-terms/{id}:
    delete:
      operationId: deletePaymentTerm
      tags: [payment-terms]
      summary: Delete a payment term
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }

  # ── Partners ─────────────────────────────────────────────────────────────────
  /partners:
    get:
      operationId: listPartners
      tags: [partners]
      summary: List all DSP platforms
      responses:
        "200":
          description: List of platforms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partner"
    post:
      operationId: createPartner
      tags: [partners]
      summary: Create a new platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
        "400":
          description: Validation error

  /partners/{id}:
    get:
      operationId: getPartner
      tags: [partners]
      summary: Get a platform by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
        "404":
          description: Not found
    patch:
      operationId: updatePartner
      tags: [partners]
      summary: Update a platform
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerUpdate"
      responses:
        "200":
          description: Updated platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
        "404":
          description: Not found
    delete:
      operationId: deletePartner
      tags: [partners]
      summary: Delete a platform
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /partners/{id}/clients:
    get:
      operationId: listPartnerClients
      tags: [partners]
      summary: List clients linked to a partner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of linked clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartnerClient"
    post:
      operationId: linkPartnerClient
      tags: [partners]
      summary: Link a client to a partner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkPartnerClientInput"
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerClient"
        "400":
          description: Validation error

  /partners/{id}/clients/{clientId}:
    delete:
      operationId: unlinkPartnerClient
      tags: [partners]
      summary: Unlink a client from a partner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Unlinked
        "404":
          description: Not found

  /partners/{id}/clients/{clientId}/events/{eventId}/payout:
    put:
      operationId: setPartnerEventPayout
      tags: [partners]
      summary: Set payout rate for a partner on a specific client event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: clientId
          in: path
          required: true
          schema:
            type: integer
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerPayoutInput"
      responses:
        "200":
          description: Payout rate set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerClientEvent"
        "404":
          description: Not found

  /partners/{id}/billing-records:
    get:
      operationId: listBillingRecords
      tags: [partners]
      summary: List billing records for a platform
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: period
          in: query
          schema:
            type: ["string", "null"]
        - name: buyingHouseId
          in: query
          schema:
            type: ["integer", "null"]
        - name: clientId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of billing records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillingRecord"
    post:
      operationId: createBillingRecord
      tags: [partners]
      summary: Add a billing record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingRecordInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRecord"
        "400":
          description: Validation error

  /partners/{id}/billing-records/{recordId}:
    patch:
      operationId: updateBillingRecord
      tags: [billing]
      summary: Update a billing record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: recordId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingRecordInput"
      responses:
        "200":
          description: Updated billing record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRecord"
    delete:
      operationId: deleteBillingRecord
      tags: [partners]
      summary: Delete a billing record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: recordId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Data Import ───────────────────────────────────────────────────────────────
  /import/{type}:
    post:
      operationId: runImport
      tags: [import]
      summary: Validate (dry-run) or commit a bulk data import for the given type
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          description: Import result (dry-run preview or committed summary)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Unknown import type or invalid request

  # ── Analytics & Dashboard ─────────────────────────────────────────────────────
  /analytics/dashboard:
    get:
      operationId: getDashboardSummary
      tags: [analytics]
      summary: Get top-level dashboard KPIs
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
        - { $ref: "#/components/parameters/Engine" }
        - { $ref: "#/components/parameters/ClientIds" }
        - { $ref: "#/components/parameters/PartnerIds" }
        - { $ref: "#/components/parameters/BuyingHouseIds" }
        - { $ref: "#/components/parameters/CostModelId" }
        - { $ref: "#/components/parameters/Compare" }
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /analytics/profit-over-time:
    get:
      operationId: getProfitOverTime
      tags: [analytics]
      summary: Profit, revenue, and cost grouped by day
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
        - { $ref: "#/components/parameters/Engine" }
        - { $ref: "#/components/parameters/ClientIds" }
        - { $ref: "#/components/parameters/PartnerIds" }
        - { $ref: "#/components/parameters/BuyingHouseIds" }
        - { $ref: "#/components/parameters/CostModelId" }
        - { $ref: "#/components/parameters/Compare" }
      responses:
        "200":
          description: Time series data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfitTimePoint"

  /analytics/forecast:
    get:
      operationId: getForecast
      tags: [analytics]
      summary: Linear revenue/cost/profit forecast projected beyond the selected date range
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
        - { $ref: "#/components/parameters/Engine" }
        - { $ref: "#/components/parameters/ClientIds" }
        - { $ref: "#/components/parameters/PartnerIds" }
        - { $ref: "#/components/parameters/BuyingHouseIds" }
        - name: metric
          in: query
          description: revenue|cost|profit, default profit
          schema:
            type: ["string", "null"]
        - name: horizon
          in: query
          description: Number of future days to project, default 7
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Historical series plus a projected forecast with confidence band
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastResponse"

  /analytics/anomalies:
    get:
      operationId: getAnomalies
      tags: [analytics]
      summary: Z-score anomaly detection over the daily revenue/cost/profit series
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
        - { $ref: "#/components/parameters/Engine" }
        - { $ref: "#/components/parameters/ClientIds" }
        - { $ref: "#/components/parameters/PartnerIds" }
        - { $ref: "#/components/parameters/BuyingHouseIds" }
        - name: metric
          in: query
          description: revenue|cost|profit, default profit
          schema:
            type: ["string", "null"]
        - name: threshold
          in: query
          description: Z-score magnitude above which a point is flagged, default 2.5
          schema:
            type: ["number", "null"]
      responses:
        "200":
          description: Daily series with per-point z-score and anomaly flag
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnomalyPoint"

  /analytics/by-client:
    get:
      operationId: getAnalyticsByClient
      tags: [analytics]
      summary: Spend, cost, profit, and margin grouped by client
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
        - { $ref: "#/components/parameters/Engine" }
        - { $ref: "#/components/parameters/ClientIds" }
        - { $ref: "#/components/parameters/PartnerIds" }
        - { $ref: "#/components/parameters/BuyingHouseIds" }
        - { $ref: "#/components/parameters/CostModelId" }
        - { $ref: "#/components/parameters/Compare" }
      responses:
        "200":
          description: Per-client analytics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientAnalytics"

  /analytics/by-platform:
    get:
      operationId: getAnalyticsByPartner
      tags: [analytics]
      summary: Spend, cost, profit, and margin grouped by platform
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
        - { $ref: "#/components/parameters/Engine" }
        - { $ref: "#/components/parameters/ClientIds" }
        - { $ref: "#/components/parameters/PartnerIds" }
        - { $ref: "#/components/parameters/BuyingHouseIds" }
        - { $ref: "#/components/parameters/CostModelId" }
        - { $ref: "#/components/parameters/Compare" }
      responses:
        "200":
          description: Per-platform analytics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartnerAnalytics"

  /analytics/margin-distribution:
    get:
      operationId: getMarginDistribution
      tags: [analytics]
      summary: Campaign margin distribution as fixed-width histogram buckets
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
        - { $ref: "#/components/parameters/Engine" }
        - { $ref: "#/components/parameters/ClientIds" }
        - { $ref: "#/components/parameters/PartnerIds" }
        - { $ref: "#/components/parameters/BuyingHouseIds" }
      responses:
        "200":
          description: Margin distribution buckets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarginBucket"

  /analytics/matrix:
    get:
      operationId: getMarginMatrix
      tags: [analytics]
      summary: Client x partner margin matrix
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
        - { $ref: "#/components/parameters/ClientIds" }
        - { $ref: "#/components/parameters/PartnerIds" }
        - { $ref: "#/components/parameters/BuyingHouseIds" }
      responses:
        "200":
          description: Client x partner margin matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatrixResponse"

  /analytics/aging:
    get:
      operationId: getAging
      tags: [analytics]
      summary: AR/AP outstanding balances bucketed by age (AR in PKR, AP in USD)
      parameters:
        - { $ref: "#/components/parameters/ClientIds" }
        - { $ref: "#/components/parameters/PartnerIds" }
      responses:
        "200":
          description: AR/AP aging buckets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgingResponse"

  /analytics/alerts:
    get:
      operationId: getAlerts
      tags: [analytics]
      summary: Get active alerts for negative profit or low margin campaigns
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /analytics/cashflow:
    get:
      operationId: getCashFlow
      tags: [analytics]
      summary: Cash-flow timeline — client collections (PKR) vs partner payouts (USD), per date
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
        - { $ref: "#/components/parameters/ClientIds" }
        - { $ref: "#/components/parameters/PartnerIds" }
      responses:
        "200":
          description: Cash-flow buckets by date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CashFlowBucket"

  /analytics/waterfall:
    get:
      operationId: getProfitWaterfall
      tags: [analytics]
      summary: Profit-leakage waterfall across matching billings
      parameters:
        - { $ref: "#/components/parameters/ClientIds" }
        - { $ref: "#/components/parameters/PartnerIds" }
        - name: period
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Ordered leakage stages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WaterfallStage"

  /analytics/invoice-funnel:
    get:
      operationId: getInvoiceFunnel
      tags: [analytics]
      summary: Invoice status funnel — billings grouped by status and by collection state
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: ["string", "null"]
        - name: dateTo
          in: query
          schema:
            type: ["string", "null"]
        - { $ref: "#/components/parameters/ClientIds" }
      responses:
        "200":
          description: Invoice status and collection-state funnel stages
          content:
            application/json:
              schema:
