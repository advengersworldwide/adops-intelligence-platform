components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Cost Models + Payment Terms ───────────────────────────────────────────
    CostModel:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        createdAt: { type: string }

    CostModelInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }

    PaymentTerm:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        days: { type: ["integer", "null"] }
        createdAt: { type: string }

    PaymentTermInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        days: { type: ["integer", "null"] }

    # ── Client ──────────────────────────────────────────────────────────────────
    Client:
      type: object
      required: [id, name, codePrefix, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        codePrefix: { type: string }
        buyingHouseId: { type: ["integer", "null"] }
        buyingHouseName: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        pocName: { type: ["string", "null"] }
        pocNumber: { type: ["string", "null"] }
        pocEmail: { type: ["string", "null"] }
        companyEmail: { type: ["string", "null"] }
        companyNumber: { type: ["string", "null"] }
        bankName: { type: ["string", "null"] }
        bankAccountNumber: { type: ["string", "null"] }
        bankAddress: { type: ["string", "null"] }
        swiftCode: { type: ["string", "null"] }
        iban: { type: ["string", "null"] }
        salesTaxNumber: { type: ["string", "null"] }
        ntnNumber: { type: ["string", "null"] }
        bulkDiscountPct: { type: ["number", "null"] }
        paymentTermsId: { type: ["integer", "null"] }
        paymentTermName: { type: ["string", "null"] }
        createdAt: { type: string }

    ClientInput:
      type: object
      required: [name, codePrefix]
      properties:
        name: { type: string, minLength: 1 }
        codePrefix: { type: string, minLength: 2, maxLength: 4, pattern: "^[A-Z0-9]{2,4}$" }
        buyingHouseId: { type: ["integer", "null"] }
        bulkDiscountPct: { type: ["number", "null"] }

    ClientUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        codePrefix: { type: string, minLength: 2, maxLength: 4, pattern: "^[A-Z0-9]{2,4}$" }
        buyingHouseId: { type: ["integer", "null"] }
        address: { type: ["string", "null"] }
        pocName: { type: ["string", "null"] }
        pocNumber: { type: ["string", "null"] }
        pocEmail: { type: ["string", "null"] }
        companyEmail: { type: ["string", "null"] }
        companyNumber: { type: ["string", "null"] }
        bankName: { type: ["string", "null"] }
        bankAccountNumber: { type: ["string", "null"] }
        bankAddress: { type: ["string", "null"] }
        swiftCode: { type: ["string", "null"] }
        iban: { type: ["string", "null"] }
        salesTaxNumber: { type: ["string", "null"] }
        ntnNumber: { type: ["string", "null"] }
        bulkDiscountPct: { type: ["number", "null"] }
        paymentTermsId: { type: ["integer", "null"] }

    ClientEvent:
      type: object
      required: [id, clientId, name, billableRate, createdAt]
      properties:
        id: { type: integer }
        clientId: { type: integer }
        name: { type: string }
        costModelId: { type: ["integer", "null"] }
        costModelName: { type: ["string", "null"] }
        billableRate: { type: number }
        createdAt: { type: string }

    ClientEventInput:
      type: object
      required: [name, billableRate]
      properties:
        name: { type: string, minLength: 1 }
        costModelId: { type: ["integer", "null"] }
        billableRate: { type: number }

    ClientEventUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        costModelId: { type: ["integer", "null"] }
        billableRate: { type: number }

    # ── BuyingHouse ──────────────────────────────────────────────────────────────
    BuyingHouse:
      type: object
      required: [id, name, clientCount, netMarginPkr, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        clientCount: { type: integer }
        netMarginPkr: { type: number }
        bulkDiscountPct: { type: ["number", "null"] }
        address: { type: ["string", "null"] }
        pocName: { type: ["string", "null"] }
        pocNumber: { type: ["string", "null"] }
        pocEmail: { type: ["string", "null"] }
        companyEmail: { type: ["string", "null"] }
        companyNumber: { type: ["string", "null"] }
        bankName: { type: ["string", "null"] }
        bankAccountNumber: { type: ["string", "null"] }
        bankAddress: { type: ["string", "null"] }
        swiftCode: { type: ["string", "null"] }
        iban: { type: ["string", "null"] }
        salesTaxNumber: { type: ["string", "null"] }
        ntnNumber: { type: ["string", "null"] }
        createdAt: { type: string }

    BuyingHouseInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        bulkDiscountPct: { type: ["number", "null"] }
        address: { type: ["string", "null"] }
        pocName: { type: ["string", "null"] }
        pocNumber: { type: ["string", "null"] }
        pocEmail: { type: ["string", "null"] }
        companyEmail: { type: ["string", "null"] }
        companyNumber: { type: ["string", "null"] }
        bankName: { type: ["string", "null"] }
        bankAccountNumber: { type: ["string", "null"] }
        bankAddress: { type: ["string", "null"] }
        swiftCode: { type: ["string", "null"] }
        iban: { type: ["string", "null"] }
        salesTaxNumber: { type: ["string", "null"] }
        ntnNumber: { type: ["string", "null"] }

    BuyingHouseAnalytics:
      type: object
      required: [totalReceivablePkr, totalPayablePkr, netMarginPkr, marginPct, monthlyTrend, clients]
      properties:
        totalReceivablePkr:
          type: number
        totalPayablePkr:
          type: number
        netMarginPkr:
          type: number
        marginPct:
          type: number
        monthlyTrend:
          type: array
          items:
            $ref: "#/components/schemas/BuyingHouseTrendPoint"
        clients:
          type: array
          items:
            $ref: "#/components/schemas/BuyingHouseClientItem"

    BuyingHouseTrendPoint:
      type: object
      required: [period, receivablePkr, payablePkr, netMarginPkr]
      properties:
        period:
          type: string
        receivablePkr:
          type: number
        payablePkr:
          type: number
        netMarginPkr:
          type: number

    BuyingHouseClientItem:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    BuyingHouseBillingRecord:
      type: object
      required: [id, period, platformId, appsflyerPins, fraudPins, actualPins, netMarginPkr, createdAt]
      properties:
        id:
          type: integer
        period:
          type: string
        platformId:
          type: integer
        platformName:
          type: ["string", "null"]
        appsflyerPins:
          type: integer
        fraudPins:
          type: integer
        actualPins:
          type: integer
        netMarginPkr:
          type: number
        createdAt:
          type: string

    # ── Partner ──────────────────────────────────────────────────────────────────
    Partner:
      type: object
      required: [id, name, codePrefix, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        codePrefix:
          type: string
        address:
          type: ["string", "null"]
        pocName:
          type: ["string", "null"]
        pocNumber:
          type: ["string", "null"]
        pocEmail:
          type: ["string", "null"]
        companyEmail:
          type: ["string", "null"]
        companyNumber:
          type: ["string", "null"]
        bankName:
          type: ["string", "null"]
        bankAccountNumber:
          type: ["string", "null"]
        bankAddress:
          type: ["string", "null"]
        swiftCode:
          type: ["string", "null"]
        iban:
          type: ["string", "null"]
        salesTaxNumber:
          type: ["string", "null"]
        ntnNumber:
          type: ["string", "null"]
        paymentTermsId:
          type: ["integer", "null"]
        paymentTermName:
          type: ["string", "null"]
        createdAt:
          type: string

    PartnerInput:
      type: object
      required: [name, codePrefix]
      properties:
        name:
          type: string
          minLength: 1
        codePrefix:
