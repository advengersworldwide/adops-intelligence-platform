  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── Dependency-Aware Delete ────────────────────────────────────────────────
    ImpactNode:
      type: object
      required: [table, id, label, singular, canDelete, requiredPermission, children, truncated]
      properties:
        table: { type: string }
        id: { type: integer }
        label: { type: string }
        singular: { type: string }
        href: { type: ["string", "null"] }
        canDelete: { type: boolean }
        requiredPermission: { type: string }
        deleteEndpoint: { type: ["string", "null"] }
        truncated: { type: boolean }
        children:
          type: array
          items: { $ref: "#/components/schemas/ImpactNode" }

    CascadeGroup:
      type: object
      required: [table, label, count, sample, canDelete, requiredPermission]
      properties:
        table: { type: string }
        label: { type: string }
        count: { type: integer }
        canDelete: { type: boolean }
        requiredPermission: { type: string }
        sample:
          type: array
          items: { $ref: "#/components/schemas/ImpactNode" }

    NullifyGroup:
      type: object
      required: [table, column, label, count]
      properties:
        table: { type: string }
        column: { type: string }
        label: { type: string }
        count: { type: integer }

    Impact:
      type: object
      required: [target, blockers, cascades, nullifies, canDeleteAll, missingPermissions, totals, fingerprint]
      properties:
        target:
          type: object
          required: [table, id, label, singular]
          properties:
            table: { type: string }
            id: { type: integer }
            label: { type: string }
            singular: { type: string }
        blockers:
          type: array
          items: { $ref: "#/components/schemas/ImpactNode" }
        cascades:
          type: array
          items: { $ref: "#/components/schemas/CascadeGroup" }
        nullifies:
          type: array
          items: { $ref: "#/components/schemas/NullifyGroup" }
        canDeleteAll: { type: boolean }
        blockedReason: { type: ["string", "null"] }
        missingPermissions:
          type: array
          items: { type: string }
        totals:
          type: object
          required: [deletes, nullifies, touchesFinancial]
          properties:
            deletes: { type: integer }
            nullifies: { type: integer }
            touchesFinancial: { type: boolean }
        fingerprint: { type: string }

    # ── Cost Models + Payment Terms ───────────────────────────────────────────
    CostModel:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        createdAt: { type: string }

    CostModelInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }

    PaymentTerm:
