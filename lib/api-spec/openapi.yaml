  # ── Dependency-Aware Delete ────────────────────────────────────────────────────
  /dependencies:
    get:
      operationId: getDependencies
      tags: [dependencies]
      summary: Resolve the deletion impact tree for an entity
      parameters:
        - { name: table, in: query, required: true, schema: { type: string } }
        - { name: id, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Impact tree
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Impact" }
        "400":
          description: Missing/invalid table or id, or unknown table
        "401":
          description: Authentication required
        "403":
          description: Forbidden — missing delete permission for the target table
        "404":
          description: Not found

  /dependencies/delete:
    post:
      operationId: deleteDependencies
      tags: [dependencies]
      summary: Delete an entity and all reviewed dependents in one transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [table, id, fingerprint]
              properties:
                table: { type: string }
                id: { type: integer }
                fingerprint: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: array
                    items:
                      type: object
                      required: [table, count]
                      properties:
                        table: { type: string }
                        count: { type: integer }
        "400":
          description: Invalid request body or unknown table
        "401":
          description: Authentication required
        "403":
          description: Forbidden — missing delete permission, or impact is no longer fully deletable
        "404":
          description: Not found
        "409":
          description: Impact changed since review (fingerprint mismatch), or a record outside the reviewed list still depends on this

